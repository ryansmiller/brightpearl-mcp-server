[project]
name = "brightpearl-mcp-server"
version = "0.1.0"
description = "MCP server + sync pipeline for Brightpearl ERP data via Google BigQuery"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.25",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "starlette>=1.3.1",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

# Flat layout, no src/: on this machine a background agent sets the macOS
# hidden flag on every .pth file in site-packages within seconds, and Python
# 3.13+ skips hidden .pth files — so editable installs silently break. Flat
# layout lets local runs import from the project root without any .pth;
# deployed images install the built wheel normally.
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brightpearl_client*", "sync*", "mcp_server*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

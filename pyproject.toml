[project]
name = "brightpearl-mcp-server"
version = "0.1.0"
description = "MCP server + sync pipeline for Brightpearl ERP data via Google BigQuery"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "google-cloud-bigquery>=3.25",
    "google-cloud-bigquery-storage>=2.25",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brightpearl_client", "src/sync", "src/mcp_server"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
